<!DOCTYPE html>
<html>

<head>

    <title>Edit Book - Mini Book Shelf</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Header -->
    <div class="header">

        <h1>📚 Mini Book Shelf</h1>

        <p>Edit Your Book Details</p>

    </div>


    <div class="container">

        <div class="form-box">

            <h2 class="section-title">✏️ Edit Book</h2>

            <form method="POST"
                  action="/update/{{ book._id }}">


                <div class="form-row">

                    <div class="form-group">

                        <label>Book Title</label>

                        <input type="text"
                               name="title"
                               value="{{ book.title }}"
                               required>

                    </div>


                    <div class="form-group">

                        <label>Author</label>

                        <input type="text"
                               name="author"
                               value="{{ book.author }}"
                               required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Category</label>

                        <input type="text"
                               name="category"
                               value="{{ book.category }}"
                               required>

                    </div>


                    <div class="form-group">

                        <label>Year</label>

                        <input type="number"
                               name="year"
                               value="{{ book.year }}"
                               required>

                    </div>

                </div>


                <div class="form-group">

                    <label>Price (₹)</label>

                    <input type="number"
                           name="price"
                           value="{{ book.price }}"
                           required>

                </div>


                <button class="add-button"
                        type="submit">

                    💾 Update Book

                </button>

            </form>


            <br>

            <a class="all-button"
               href="/">

                ← Back to Book Shelf

            </a>

        </div>

    </div>

</body>

</html>
